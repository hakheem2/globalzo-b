{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | USPS Globals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body class="dashboard-login-page">

<div class="dashboard-login-card">
    <div class="dashboard-login-brand">
        <span class="brand-mark">U</span>
        <div>
            <strong>USPS Globals</strong>
            <span>Operations Dashboard</span>
        </div>
    </div>

    <div class="dashboard-login-heading">
        <h1>Welcome back</h1>
        <p>Sign in to manage your shipments.</p>
    </div>

    {% if error %}
    <div class="dashboard-login-error">
        <i class="bi bi-exclamation-circle"></i>
        {{ error }}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="dashboard-login-field">
            <label>Username</label>
            <div>
                <i class="bi bi-person"></i>
                <input type="text" name="username" required autocomplete="username">
            </div>
        </div>

        <div class="dashboard-login-field">
            <label>Password</label>
            <div>
                <i class="bi bi-lock"></i>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
        </div>

        <button type="submit" class="dashboard-login-btn">
            Sign In
            <i class="bi bi-arrow-right"></i>
        </button>
    </form>
</div>

</body>
</html>

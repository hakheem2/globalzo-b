{% extends "admin/change_form.html" %}

{% block extrahead %}
    {{ block.super }}

    <style>
        .mapbox-shipment-search {
            margin: 10px 0 15px;
            max-width: 600px;
        }

        .mapbox-shipment-search input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .mapbox-shipment-results {
            position: relative;
            z-index: 9999;
            background: lightgray;
        }

        .mapbox-shipment-result {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-top: 0;
            background: lightgray;
            color: #222;
            cursor: pointer;
            font-size: 14px;
        }

        .mapbox-shipment-result:hover {
            background: #f0f4f8;
        }
        
    </style>

    <style>
        .tracking-mapbox-search {
            max-width: 600px;
        }

        .tracking-mapbox-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #222;
            background: #fff;
        }

        .tracking-mapbox-results {
            position: relative;
            z-index: 9999;
            background: #fff;
        }

        .tracking-mapbox-result {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-top: 0;
            background: #fff;
            color: #222;
            cursor: pointer;
            font-size: 14px;
        }

        .tracking-mapbox-result:hover {
            background: #f0f4f8;
        }
        </style>

    <script>
        const MAPBOX_TOKEN = "{{ MAPBOX_ACCESS_TOKEN }}";
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            function setupLocationSearch(searchId, resultsId, fieldPrefix) {
                const input = document.getElementById(searchId);
                const results = document.getElementById(resultsId);
                const locationField = document.getElementById(`id_${fieldPrefix}`);
                const latitudeField = document.getElementById(`id_${fieldPrefix}_latitude`);
                const longitudeField = document.getElementById(`id_${fieldPrefix}_longitude`);

                let timeout;

                input.addEventListener("input", function () {
                    clearTimeout(timeout);

                    const query = input.value.trim();

                    if (query.length < 2) {
                        results.innerHTML = "";
                        return;
                    }

                    timeout = setTimeout(async function () {
                        const url =
                            `https://api.mapbox.com/search/geocode/v6/forward` +
                            `?q=${encodeURIComponent(query)}` +
                            `&limit=5` +
                            `&access_token=${MAPBOX_TOKEN}`;

                        try {
                            const response = await fetch(url);
                            const data = await response.json();

                            results.innerHTML = "";

                            data.features.forEach(function (feature) {
                                const item = document.createElement("div");
                                item.className = "mapbox-shipment-result";

                                const name =
                                    feature.properties.full_address ||
                                    feature.properties.name;

                                item.textContent = name;

                                item.addEventListener("click", function () {
                                    const [longitude, latitude] =
                                        feature.geometry.coordinates;

                                    locationField.value = name;
                                    latitudeField.value = latitude;
                                    longitudeField.value = longitude;
                                    input.value = name;
                                    results.innerHTML = "";
                                });

                                results.appendChild(item);
                            });
                        } catch (error) {
                            console.error("Mapbox search error:", error);
                        }
                    }, 400);
                });
            }

            setupLocationSearch(
                "origin-search",
                "origin-results",
                "origin"
            );

            setupLocationSearch(
                "destination-search",
                "destination-results",
                "destination"
            );
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            function setupTrackingLocation(row) {
                const locationField = row.querySelector(".tracking-location-field");
                const latitudeField = row.querySelector(".tracking-latitude-field");
                const longitudeField = row.querySelector(".tracking-longitude-field");

                if (!locationField || !latitudeField || !longitudeField) return;
                if (row.querySelector(".tracking-mapbox-search")) return;

                const wrapper = document.createElement("div");
                wrapper.className = "tracking-mapbox-search";
                wrapper.style.marginBottom = "12px";

                const input = document.createElement("input");
                input.type = "text";
                input.className = "tracking-mapbox-input";
                input.placeholder = "Search tracking location...";
                input.autocomplete = "off";

                const results = document.createElement("div");
                results.className = "tracking-mapbox-results";

                wrapper.appendChild(input);
                wrapper.appendChild(results);

                locationField.parentElement.insertBefore(wrapper, locationField);

                let timeout;

                input.addEventListener("input", function () {
                    clearTimeout(timeout);

                    const query = input.value.trim();

                    if (query.length < 2) {
                        results.innerHTML = "";
                        return;
                    }

                    timeout = setTimeout(async function () {
                        try {
                            const url =
                                `https://api.mapbox.com/search/geocode/v6/forward` +
                                `?q=${encodeURIComponent(query)}` +
                                `&limit=5` +
                                `&access_token=${MAPBOX_TOKEN}`;

                            const response = await fetch(url);
                            const data = await response.json();

                            results.innerHTML = "";

                            data.features.forEach(function (feature) {
                                const item = document.createElement("div");
                                item.className = "tracking-mapbox-result";

                                const name =
                                    feature.properties.full_address ||
                                    feature.properties.name;

                                item.textContent = name;

                                item.addEventListener("click", function () {
                                    const [longitude, latitude] =
                                        feature.geometry.coordinates;

                                    locationField.value = name;
                                    latitudeField.value = latitude;
                                    longitudeField.value = longitude;
                                    input.value = name;

                                    results.innerHTML = "";
                                });

                                results.appendChild(item);
                            });

                        } catch (error) {
                            console.error("Mapbox tracking search error:", error);
                        }
                    }, 400);
                });
            }

            function initializeTrackingRows() {
                document.querySelectorAll(".inline-related").forEach(function (row) {
                    if (row.querySelector(".tracking-location-field")) {
                        setupTrackingLocation(row);
                    }
                });
            }

            initializeTrackingRows();

            const observer = new MutationObserver(function () {
                initializeTrackingRows();
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        });
    </script>
{% endblock %}

{% block content %}
    <div class="mapbox-shipment-search">
        <label><strong>Search Origin</strong></label>
        <input type="text" id="origin-search"
               placeholder="Search origin location..." autocomplete="off">
        <div id="origin-results" class="mapbox-shipment-results"></div>
    </div>

    <div class="mapbox-shipment-search">
        <label><strong>Search Destination</strong></label>
        <input type="text" id="destination-search"
               placeholder="Search destination location..." autocomplete="off">
        <div id="destination-results" class="mapbox-shipment-results"></div>
    </div>

    {{ block.super }}
{% endblock %}
